  <p>
    Next we give explicit vertex coordinates which we use to generate all of the vertices.
  </p>
  <div class="abs" style="width:900px; left:10px;">
    <p>
      \[
        \begin{align*}
          v &= (1,0,0) \\
          v' &= \alpha(1,1,1) \\
          v'' &= \beta(0,1,\phi)
        \end{align*}
      \] where \[
        \begin{align*}
          \alpha &= (\sqrt 5 + 4)/11,\,\text{and} \\
          \beta &= \phi/3.
        \end{align*}
      \]
    </p>
