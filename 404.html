<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found | peterkagey.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #222;
      padding: 3rem 1rem;
      margin: 0 auto;
      line-height: 1.6;
      max-width: 700px;
    }
    #missing-url {
      font-weight: 600;
    }
    #four-oh-four {
      margin: 0 auto;
      text-align: center;
      font-weight: 1000;
      font-size: clamp(1rem, 40vw, 20rem);
      padding:0rem;
      line-height: 0.8;
    }
    #not-found {
      margin: 0 auto;
      text-align: center;
      font-weight: 100;
      font-size: clamp(2rem, 8vw, 4rem);
      padding:0;
    }
    #not-found > a {
      color: #222;
      text-decoration: none;
    }
    p {
      max-width: 600px;
      margin: 0 auto 1rem;
    }
  </style>
</head>
<body>
  <div id="four-oh-four">404</div>
  <div id="not-found"><a href="https://en.wikipedia.org/wiki/HTTP_404">Not Found</a></div>
  <p>Sorry, <span id="missing-url">peterkagey.com</span> is missing!</p>
  <p>If you clicked a link on the web and it brought you here, it's likely because I broke some links when I migrated my website. If you have a GitHub account, it would help me out if you took 15 seconds to <a id="report-link" href="#">report the issue</a> (auto-filled).</p>

  <script>
    const currentUrl = window.location.href;
    const issueTitle = encodeURIComponent("Missing page: " + currentUrl);
    const issueBody = encodeURIComponent(`**Missing page:** ${currentUrl}\n\n**Source:** [URL of page with broken link.]`);
    const issueUrl = `https://github.com/peterkagey/personal-website-html/issues/new?title=${issueTitle}&body=${issueBody}`;

    document.getElementById('report-link').setAttribute('href', issueUrl);
    document.getElementById('missing-url').textContent = currentUrl;
  </script>
</body>
</html>
